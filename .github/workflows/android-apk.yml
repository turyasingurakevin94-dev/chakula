# Builds an installable Android app (APK) on Expo's build servers.
# Run it from the Actions tab ("Run workflow"). The install link appears in the run summary.
# Needs the EXPO_TOKEN repository secret.
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      where:
        description: Where to build. "github" is free; "expo" uses the Expo plan's monthly Android builds.
        type: choice
        options: [github, expo]
        default: github
  pull_request:
    paths:
      - eas.json
      - .github/workflows/android-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Link Expo project
        run: eas init --non-interactive --force

      # Points the app at the project's update server, so the installed app picks up
      # what "Publish app update" publishes after each merge.
      - name: Configure updates
        run: eas update:configure --platform android --non-interactive

      # An APK built without an update address never downloads updates, so stop here instead.
      - name: Check update settings
        run: |
          npx expo config --type public --json > config.json
          node -e '
            const c = require("./config.json");
            console.log("updates:", JSON.stringify(c.updates), "runtime:", JSON.stringify(c.runtimeVersion));
            if (!c.updates || !c.updates.url) { console.error("::error::app.json has no updates.url"); process.exit(1); }
          '

      # Free: builds on this GitHub runner with the same signing key Expo keeps for the app, so it
      # installs over the current APK. Pull requests build here too, as a check.
      - uses: actions/setup-java@v4
        if: inputs.where != 'expo'
        with:
          distribution: temurin
          java-version: 17

      # The app's own Gradle settings give the build too little memory for this runner, and the
      # build stalls on "OutOfMemoryError: Metaspace". The user-level file wins over the project's.
      - name: Give Gradle more memory
        if: inputs.where != 'expo'
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Build APK on GitHub
        if: inputs.where != 'expo'
        timeout-minutes: 90
        # Only the 64-bit ARM code every current Android phone runs: about a quarter of the native
        # compiling, so the free runner finishes much sooner.
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          # The local build's "expo doctor" step crashes the build when it runs past 30 s
          # (@expo/build-tools kills a process that has already exited). The checks above cover it.
          EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: '1'
        run: eas build --platform android --profile preview --non-interactive --local --output "$GITHUB_WORKSPACE/chakula-student.apk"

      - name: Keep the APK for publishing
        if: inputs.where != 'expo' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: chakula-student-apk
          path: ${{ github.workspace }}/chakula-student.apk
          retention-days: 1

      - name: Build APK on Expo
        if: inputs.where == 'expo'
        run: |
          eas build --platform android --profile preview --non-interactive --json > build.json
          cat build.json
          node -e '
            const b = require("./build.json")[0] || {};
            const a = b.artifacts || {};
            const app = b.app || {};
            const owner = (app.ownerAccount || {}).name;
            const page = owner && app.slug
              ? "https://expo.dev/accounts/" + owner + "/projects/" + app.slug + "/builds/" + b.id
              : "https://expo.dev/projects/" + (app.id || b.projectId) + "/builds/" + b.id;
            const lines = ["## Android app ready", "", "- Build page (open on your phone to install): " + page];
            const apk = a.buildUrl || a.applicationArchiveUrl;
            if (apk) lines.push("- Direct APK download: " + apk);
            console.log(lines.join("\n"));
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

  # Attaches the APK to a pre-release, so it downloads on a phone without signing in. A job of its
  # own, so only this step (never the build, which runs on pull requests too) can write to the repo.
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.where != 'expo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chakula-student-apk

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="student-apk-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$tag" chakula-student.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Android app (build ${{ github.run_number }})" --notes "Install on Android: open this page on the phone and tap chakula-student.apk."
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/chakula-student.apk"
          printf '## Android app ready\n\n- Direct APK download: %s\n' "$url" | tee -a "$GITHUB_STEP_SUMMARY"
