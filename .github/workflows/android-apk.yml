# Builds an installable Android app (APK) on Expo's build servers.
# Run it from the Actions tab ("Run workflow"). The install link appears in the run summary.
# Needs the EXPO_TOKEN repository secret.
name: Build Android app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - eas.json
      - .github/workflows/android-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Link Expo project
        run: eas init --non-interactive --force

      - name: Build APK
        run: |
          eas build --platform android --profile preview --non-interactive --json > build.json
          cat build.json
          node -e '
            const b = require("./build.json")[0] || {};
            const a = b.artifacts || {};
            const lines = ["## Android app ready", "", "- Build page (open on your phone to install): https://expo.dev/projects/" + b.projectId + "/builds/" + b.id];
            const apk = a.buildUrl || a.applicationArchiveUrl;
            if (apk) lines.push("- Direct APK download: " + apk);
            console.log(lines.join("\n"));
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
