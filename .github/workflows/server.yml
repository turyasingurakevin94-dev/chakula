# Type-checks the backend and runs its end-to-end test (sign in, MoMo, kitchen, rider, handover)
# on an in-memory database. No keys or paid services needed.
name: Server checks

on:
  pull_request:
    paths:
      - server/**
      - .github/workflows/server.yml
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/server.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
